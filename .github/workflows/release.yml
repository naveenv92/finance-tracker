name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-darwin-amd64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w" -o finance-tracker-darwin-amd64 .
      - uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-darwin-amd64
          path: finance-tracker-darwin-amd64

  build-darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w" -o finance-tracker-darwin-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-darwin-arm64
          path: finance-tracker-darwin-arm64

  build-windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w" -o finance-tracker-windows-amd64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-windows-amd64
          path: finance-tracker-windows-amd64.exe

  build-windows-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install llvm-mingw (Windows arm64 cross-compiler)
        run: |
          LLVM_MINGW_VERSION=20240619
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64.tar.xz"
          tar xf "llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64.tar.xz"
          echo "$PWD/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
      - name: Build
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: aarch64-w64-mingw32-clang
        run: go build -ldflags="-s -w" -o finance-tracker-windows-arm64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-windows-arm64
          path: finance-tracker-windows-arm64.exe

  release:
    needs:
      - build-darwin-amd64
      - build-darwin-arm64
      - build-windows-amd64
      - build-windows-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/finance-tracker-darwin-amd64/finance-tracker-darwin-amd64
            artifacts/finance-tracker-darwin-arm64/finance-tracker-darwin-arm64
            artifacts/finance-tracker-windows-amd64/finance-tracker-windows-amd64.exe
            artifacts/finance-tracker-windows-arm64/finance-tracker-windows-arm64.exe
