<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settle Debts - Finance Tracker</title>

  <!-- Theme (must run before CSS to prevent flash) -->
  <script src="js/core/theme.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/settle.css">
</head>
<body>
  <script src="js/core/icons.js"></script>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">FT</div>
      <nav class="sidebar-nav">
        <div class="sidebar-nav-top">
          <a href="dashboard.html" class="nav-icon-item" data-tooltip="Dashboard">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-dashboard"/></svg>
          </a>
          <a href="dashboard.html?modal=import" class="nav-icon-item" data-tooltip="Import CSV">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-import"/></svg>
          </a>
          <a href="review.html" class="nav-icon-item" data-tooltip="Review Transactions">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-review"/></svg>
          </a>
          <a href="transactions.html" class="nav-icon-item" data-tooltip="View Transactions">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-transactions"/></svg>
          </a>
          <a href="analytics.html" class="nav-icon-item" data-tooltip="Analytics">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-analytics"/></svg>
          </a>
          <a href="settle.html" class="nav-icon-item active" data-tooltip="Settle Debts">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-settle"/></svg>
          </a>
          <a href="dashboard.html?modal=categories" class="nav-icon-item" data-tooltip="Manage Categories">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-categories"/></svg>
          </a>
          <a href="dashboard.html?modal=templates" class="nav-icon-item" data-tooltip="Manage Templates">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-templates"/></svg>
          </a>
        </div>
        <div class="sidebar-nav-bottom">
          <a href="index.html" class="nav-icon-item" data-tooltip="Change Database">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-change-db"/></svg>
          </a>
          <a href="settings.html" class="nav-icon-item" data-tooltip="Settings">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-settings"/></svg>
          </a>
        </div>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Settle Debts</h1>
        <p class="page-description">Who owes who, and record when debts are paid off.</p>
      </div>

      <div class="settle-container">
        <section class="settle-section">
          <div class="settle-section-header">
            <h2>Balances</h2>
            <button class="btn btn-primary" id="record-settlement-btn">Record Settlement</button>
          </div>
          <p class="text-muted" id="balances-empty" style="display:none;">Everyone's settled up.</p>
          <div id="balances-container"></div>
        </section>

        <section class="settle-section">
          <h2>Settlement History</h2>
          <p class="text-muted" id="history-empty" style="display:none;">No settlements recorded yet.</p>
          <div id="history-container"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- JavaScript -->
  <script type="module" src="js/pages/settle.js"></script>
</body>
</html>
