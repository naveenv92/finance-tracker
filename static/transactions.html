<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions - Finance Tracker</title>

  <!-- Theme (must run before CSS to prevent flash) -->
  <script src="js/core/theme.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/pages/transactions.css">
</head>
<body>
  <script src="js/core/icons.js"></script>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">FT</div>
      <nav class="sidebar-nav">
        <div class="sidebar-nav-top">
          <a href="dashboard.html" class="nav-icon-item" data-tooltip="Dashboard">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-dashboard"/></svg>
          </a>
          <a href="dashboard.html?modal=import" class="nav-icon-item" data-tooltip="Import CSV">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-import"/></svg>
          </a>
          <a href="review.html" class="nav-icon-item" data-tooltip="Review Transactions">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-review"/></svg>
          </a>
          <a href="transactions.html" class="nav-icon-item active" data-tooltip="View Transactions">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-transactions"/></svg>
          </a>
          <a href="analytics.html" class="nav-icon-item" data-tooltip="Analytics">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-analytics"/></svg>
          </a>
          <a href="dashboard.html?modal=categories" class="nav-icon-item" data-tooltip="Manage Categories">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-categories"/></svg>
          </a>
          <a href="dashboard.html?modal=templates" class="nav-icon-item" data-tooltip="Manage Templates">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-templates"/></svg>
          </a>
        </div>
        <div class="sidebar-nav-bottom">
          <a href="index.html" class="nav-icon-item" data-tooltip="Change Database">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-change-db"/></svg>
          </a>
          <a href="settings.html" class="nav-icon-item" data-tooltip="Settings">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-settings"/></svg>
          </a>
        </div>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Transactions</h1>
        <p class="page-description">View and manage all your transactions. Only reviewed transactions are shown.</p>
      </div>

      <!-- Table Container -->
      <div class="table-container">
        <div class="table-header">
          <h3 class="table-title">All Transactions</h3>
          <div class="table-actions">
            <div class="search-bar">
              <span class="search-icon">🔍</span>
              <input type="text" placeholder="Search by merchant..." id="search-input">
            </div>
            <button class="btn btn-secondary" id="export-csv-btn">Export CSV</button>
            <button class="btn btn-primary" id="add-transaction-btn">+ Add Transaction</button>
          </div>
        </div>

        <!-- Filters -->
        <div class="table-filters" id="filters">
          <!-- Filters will be inserted here -->
        </div>

        <!-- Table -->
        <div id="transactions-table"></div>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
          <div class="pagination-info" id="pagination-info"></div>
          <div class="pagination-controls" id="pagination-controls"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Bulk action bar -->
  <div class="bulk-action-bar" id="bulk-action-bar" hidden>
    <span class="bulk-action-count" id="bulk-action-count"></span>
    <div class="bulk-action-buttons">
      <button class="btn btn-secondary" id="bulk-category-btn">Assign Category</button>
      <button class="btn btn-danger" id="bulk-delete-btn">Delete</button>
      <button class="btn btn-ghost" id="bulk-clear-btn">Clear</button>
    </div>
  </div>

  <!-- JavaScript -->
  <script type="module" src="js/pages/transactions.js"></script>
</body>
</html>
