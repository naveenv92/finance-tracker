<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Finance Tracker</title>

  <!-- Theme (must run before CSS to prevent flash) -->
  <script src="js/core/theme.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/pages/dashboard.css">
</head>
<body>
  <script src="js/core/icons.js"></script>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">FT</div>
      <nav class="sidebar-nav">
        <div class="sidebar-nav-top">
          <a href="dashboard.html" class="nav-icon-item active" data-tooltip="Dashboard">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-dashboard"/></svg>
          </a>
          <a href="dashboard.html?modal=import" class="nav-icon-item" data-tooltip="Import CSV">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-import"/></svg>
          </a>
          <a href="review.html" class="nav-icon-item" data-tooltip="Review Transactions">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-review"/></svg>
          </a>
          <a href="transactions.html" class="nav-icon-item" data-tooltip="View Transactions">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-transactions"/></svg>
          </a>
          <a href="analytics.html" class="nav-icon-item" data-tooltip="Analytics">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-analytics"/></svg>
          </a>
          <a href="dashboard.html?modal=categories" class="nav-icon-item" data-tooltip="Manage Categories">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-categories"/></svg>
          </a>
          <a href="dashboard.html?modal=templates" class="nav-icon-item" data-tooltip="Manage Templates">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-templates"/></svg>
          </a>
        </div>
        <div class="sidebar-nav-bottom">
          <a href="index.html" class="nav-icon-item" data-tooltip="Change Database" id="change-db-link">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-change-db"/></svg>
          </a>
          <a href="settings.html" class="nav-icon-item" data-tooltip="Settings">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-settings"/></svg>
          </a>
        </div>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="dashboard-header">
        <div class="dashboard-title-section">
          <h1>Dashboard</h1>
          <p class="dashboard-db-name" id="db-name"></p>
        </div>
        <div style="display:flex;gap:var(--spacing-sm);">
          <button class="nav-icon-item tooltip-left" id="change-db-btn" data-tooltip="Change Database">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-change-db"/></svg>
          </button>
          <a href="settings.html" class="nav-icon-item tooltip-left" data-tooltip="Settings">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-settings"/></svg>
          </a>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid" id="stats-grid">
        <!-- Stats cards will be inserted here -->
      </div>

      <!-- Actions Section -->
      <div class="actions-section">
        <h2>Quick Actions</h2>
        <div class="actions-grid" id="actions-grid">
          <!-- Action cards will be inserted here -->
        </div>
      </div>
    </main>
  </div>

  <!-- JavaScript -->
  <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
