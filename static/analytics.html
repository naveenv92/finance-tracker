<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - Finance Tracker</title>

  <!-- Theme (must run before CSS to prevent flash) -->
  <script src="js/core/theme.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/analytics.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <script src="js/core/icons.js"></script>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">FT</div>
      <nav class="sidebar-nav">
        <div class="sidebar-nav-top">
          <a href="dashboard.html" class="nav-icon-item" data-tooltip="Dashboard">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-dashboard"/></svg>
          </a>
          <a href="dashboard.html?modal=import" class="nav-icon-item" data-tooltip="Import CSV">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-import"/></svg>
          </a>
          <a href="review.html" class="nav-icon-item" data-tooltip="Review Transactions">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-review"/></svg>
          </a>
          <a href="transactions.html" class="nav-icon-item" data-tooltip="View Transactions">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-transactions"/></svg>
          </a>
          <a href="analytics.html" class="nav-icon-item active" data-tooltip="Analytics">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-analytics"/></svg>
          </a>
          <a href="dashboard.html?modal=categories" class="nav-icon-item" data-tooltip="Manage Categories">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-categories"/></svg>
          </a>
          <a href="dashboard.html?modal=templates" class="nav-icon-item" data-tooltip="Manage Templates">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-templates"/></svg>
          </a>
        </div>
        <div class="sidebar-nav-bottom">
          <a href="index.html" class="nav-icon-item" data-tooltip="Change Database">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-change-db"/></svg>
          </a>
          <a href="settings.html" class="nav-icon-item" data-tooltip="Settings">
            <svg width="20" height="20" aria-hidden="true"><use href="#icon-settings"/></svg>
          </a>
        </div>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Analytics</h1>
        <p class="page-description">Spending insights from your reviewed transactions.</p>
      </div>

      <!-- Filters -->
      <div class="analytics-filters" id="analytics-filters"></div>

      <!-- Stat Cards -->
      <div class="analytics-stats" id="analytics-stats">
        <div class="analytics-stats-row">
          <div class="stat-card">
            <div class="stat-label">Total Spent Lifetime</div>
            <div class="stat-value" id="stat-total-lifetime">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Avg Spent / Day Lifetime</div>
            <div class="stat-value" id="stat-avg-day-lifetime">—</div>
          </div>
        </div>
        <div class="analytics-stats-row">
          <div class="stat-card">
            <div class="stat-label">Total Spent This Month</div>
            <div class="stat-value" id="stat-total-month">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Avg Spent / Day This Month</div>
            <div class="stat-value" id="stat-avg-day-month">—</div>
          </div>
        </div>
      </div>

      <!-- Bar Chart -->
      <div class="analytics-card">
        <h2 class="analytics-card-title">Spending Over Time</h2>
        <div class="chart-container chart-container--bar">
          <canvas id="chart-spending-over-time"></canvas>
        </div>
      </div>

      <!-- Stacked Bar: By Category -->
      <div class="analytics-card">
        <h2 class="analytics-card-title">Spending by Category</h2>
        <div class="chart-container chart-container--stacked">
          <canvas id="chart-by-category"></canvas>
        </div>
        <div class="chart-legend" id="legend-by-category"></div>
      </div>

      <!-- Stacked Bar: By Source -->
      <div class="analytics-card">
        <h2 class="analytics-card-title">Spending by Source</h2>
        <div class="chart-container chart-container--stacked">
          <canvas id="chart-by-source"></canvas>
        </div>
        <div class="chart-legend" id="legend-by-source"></div>
      </div>
    </main>
  </div>

  <!-- JavaScript -->
  <script type="module" src="js/pages/analytics.js"></script>
</body>
</html>
